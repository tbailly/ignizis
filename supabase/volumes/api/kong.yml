_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    plugins:
      - name: cors
        config:
          origins: ["http://localhost:8080"]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]
          headers: [Accept, Authorization, Content-Type, apikey, prefer, x-upsert, content-profile, accept-profile, x-client-info, x-supabase-client-platform, x-supabase-client-platform-version, x-supabase-api-version, x-supabase-client-runtime, x-supabase-client-runtime-version]
          exposed_headers: [Content-Range, X-Total-Count]
          credentials: true
          max_age: 3600
    routes:
      - name: auth-v1-all
        strip_path: true
        paths: [/auth/v1]

  - name: rest-v1
